[package]
name = "engine3d_nostd_"
version = "0.1.0"
edition = "2024"


[[bin]]
name = "engine3d"
path = "src/main.rs"
test = false
bench = false

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_System_Memory",
    "Win32_Foundation",

    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Console",
    "Win32_System_Memory",

    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",

    "Win32_Storage_FileSystem",

    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
]

[profile.dev]
panic = "abort"
